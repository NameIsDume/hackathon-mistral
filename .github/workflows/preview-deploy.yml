# Hobby plan: Vercel blocks git deploys of a private repo when the commit author
# is not a team member. This deploys those pushes as previews with the owner's token.
name: Preview deploy

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Pushes by the team owner already deploy through the Vercel git integration.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'NameIsDume'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(pnpm dlx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - run: echo "Preview ${{ github.ref_name }}: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
